<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Coin Toss</h1>
        <div class="coin" id="coin">
            <div class="heads">
                <img src="heads.png" alt="Heads">
            </div>
            <div class="tails">
                <img src="tails.png" alt="Tails">
            </div>
        </div>
        <div class="controls">
            <button id="flip-button">Flip Coin</button>
            <div id="status">Click the button to toss!</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
